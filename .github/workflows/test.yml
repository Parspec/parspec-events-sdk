name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Each SDK on the oldest runtime it claims to support, and on a current one.
  node:
    strategy: { matrix: { node: ['18', '22'] } }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      - run: node --test test.js
        working-directory: node
  python:
    strategy: { matrix: { python: ['3.9', '3.13'] } }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: pip install cryptography
      - run: python -m unittest
        working-directory: python
  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      # The library targets net8.0 and net10.0; building it on the .NET 8 SDK alone checks the net8.0 build.
      - run: dotnet build csharp/Parspec.Events -f net8.0
  csharp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet run --project csharp/Parspec.Events.Tests
  java:
    strategy: { matrix: { java: ['17', '21'] } }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '${{ matrix.java }}' }
      - run: javac --release 17 -d out $(find src -name '*.java') && java -cp out com.parspec.events.FixturesTest
        working-directory: java
  # The live flow against the fake PM, across all four languages.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install cryptography
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: node harness/run.js live --fake
      - run: node --test harness/playground.test.js
